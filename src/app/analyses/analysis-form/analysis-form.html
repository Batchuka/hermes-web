<h1>Analyze a proposal</h1>
<form (ngSubmit)="analyze()">
  <label>Farmer <input name="farmer" [(ngModel)]="farmer" /></label>
  <label>Income <input name="income" type="number" [(ngModel)]="income" /></label>
  <label>Amount <input name="amount" type="number" [(ngModel)]="amount" /></label>
  <label>Term (months) <input name="termMonths" type="number" [(ngModel)]="termMonths" /></label>
  <button type="submit">Analyze</button>
  @if (error(); as message) {
    <p>{{ message }}</p>
  }
  @if (result(); as analysis) {
    <p>Score: {{ analysis.score }} · Limit: {{ analysis.creditLimit }}</p>
  }
</form>
@if (result(); as analysis) {
  @if (analysis.decision) {
    <p>Decision: {{ analysis.decision }} · {{ analysis.reason }}</p>
  } @else {
    <label>Reason <input name="reason" [(ngModel)]="reason" /></label>
    <button type="button" (click)="decide('APPROVED')">Approve</button>
    <button type="button" (click)="decide('REJECTED')">Reject</button>
  }
}

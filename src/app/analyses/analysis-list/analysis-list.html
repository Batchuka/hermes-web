<h2>Analyses</h2>
<table mat-table [dataSource]="analyses()">
  <ng-container matColumnDef="farmer">
    <th mat-header-cell *matHeaderCellDef>Farmer</th>
    <td mat-cell *matCellDef="let a">{{ a.farmer }}</td>
  </ng-container>
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let a">{{ a.amount }}</td>
  </ng-container>
  <ng-container matColumnDef="score">
    <th mat-header-cell *matHeaderCellDef>Score</th>
    <td mat-cell *matCellDef="let a">{{ a.score }}</td>
  </ng-container>
  <ng-container matColumnDef="decision">
    <th mat-header-cell *matHeaderCellDef>Decision</th>
    <td mat-cell *matCellDef="let a">
      <span class="status" [class]="a.decision ? a.decision.toLowerCase() : 'pending'">
        {{ a.decision ?? 'pending' }}
      </span>
    </td>
  </ng-container>
  <ng-container matColumnDef="reason">
    <th mat-header-cell *matHeaderCellDef>Reason</th>
    <td mat-cell *matCellDef="let a">{{ a.reason }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let a; columns: columns"></tr>
</table>

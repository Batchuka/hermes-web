<h2>Proposals</h2>
<table mat-table [dataSource]="proposals()">
  <ng-container matColumnDef="farmer">
    <th mat-header-cell *matHeaderCellDef>Farmer</th>
    <td mat-cell *matCellDef="let p">{{ p.farmer }}</td>
  </ng-container>
  <ng-container matColumnDef="equipment">
    <th mat-header-cell *matHeaderCellDef>Equipment</th>
    <td mat-cell *matCellDef="let p">{{ p.equipment }}</td>
  </ng-container>
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let p">{{ p.amount }}</td>
  </ng-container>
  <ng-container matColumnDef="termMonths">
    <th mat-header-cell *matHeaderCellDef>Term (months)</th>
    <td mat-cell *matCellDef="let p">{{ p.termMonths }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let p; columns: columns" (click)="selected.emit(p.id)"></tr>
</table>

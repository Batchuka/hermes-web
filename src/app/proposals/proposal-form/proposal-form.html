<form (ngSubmit)="register()">
  <mat-form-field>
    <mat-label>Farmer</mat-label>
    <input matInput name="farmer" [(ngModel)]="farmer" [errorStateMatcher]="refuses('farmer')" />
    <mat-error>{{ errors()['farmer'] }}</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Equipment</mat-label>
    <input
      matInput
      name="equipment"
      [(ngModel)]="equipment"
      [errorStateMatcher]="refuses('equipment')"
    />
    <mat-error>{{ errors()['equipment'] }}</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Amount</mat-label>
    <input
      matInput
      name="amount"
      type="number"
      [(ngModel)]="amount"
      [errorStateMatcher]="refuses('amount')"
    />
    <mat-error>{{ errors()['amount'] }}</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Term (months)</mat-label>
    <input
      matInput
      name="termMonths"
      type="number"
      [(ngModel)]="termMonths"
      [errorStateMatcher]="refuses('termMonths')"
    />
    <mat-error>{{ errors()['termMonths'] }}</mat-error>
  </mat-form-field>
  <button mat-flat-button type="submit">Register</button>
  @if (saved(); as proposal) {
    <p>Saved. id: {{ proposal.id }}</p>
  }
</form>
